<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nexora</title>

    <!-- 본문 폰트: tokens.css의 --font-family-sans가 'Pretendard Variable'을 1순위로 쓰지만
         실제로 로드하는 곳이 없어서, Segoe UI/시스템 폰트의 한글 대체 글리프가 안 걸리는 환경(임베디드
         웹뷰 등)에서는 라벨 자리(레이아웃 공간)만 남고 글자가 안 보이는 문제가 생길 수 있다. -->
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 파비콘 & 앱 아이콘 -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- PWA 테마 & 앱 모드 -->
    <meta name="theme-color" content="#217346" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS 홈 화면 앱: 상태바를 투명(글자 흰색)으로 두고 아래 초록 타이틀바가 상태바 영역까지 채운다. default면 흰 바가 된다 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexora" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iOS Safari는 user-scalable=no를 무시하므로 핀치 제스처를 직접 막는다
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault() })
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
