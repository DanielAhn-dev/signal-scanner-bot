<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexora</title>

    <!-- 본문 폰트: tokens.css의 --font-family-sans가 'Pretendard Variable'을 1순위로 쓰지만
         실제로 로드하는 곳이 없어서, Segoe UI/시스템 폰트의 한글 대체 글리프가 안 걸리는 환경(임베디드
         웹뷰 등)에서는 라벨 자리(레이아웃 공간)만 남고 글자가 안 보이는 문제가 생길 수 있다.
         통파일(pretendardvariable.css)은 한글 전체 글리프 2MB를 첫 방문에 받으므로, 화면에 쓰인 글자 묶음만
         받는 동적 서브셋을 쓴다(모바일 첫 방문 전송량 2MB → 수백 KB). -->
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 파비콘 & 앱 아이콘 -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- PWA 테마 & 앱 모드 -->
    <meta name="theme-color" content="#217346" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS 홈 화면 앱: 최근 iOS에서 black-translucent는 상태바 밑 콘텐츠(타이틀바 아이콘)를 흐리게 덮는다. black이면 콘텐츠가 상태바 아래에서 시작한다 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Nexora" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
