name: Integrity Audit (manual)

# 정기 실행은 Vercel cron(vercel.json, KST 16:10)이 맡는다. 예전엔 여기 스케줄과 Vercel cron(UTC 16시 =
# KST 01시)이 둘 다 돌아, GitHub 지연(4~5시간)까지 겹쳐 밤·새벽에 점검 알림이 두 번 왔다.
# 수동 재실행용으로만 남긴다.
on:
  workflow_dispatch:

jobs:
  run-integrity-audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      TZ: "Asia/Seoul"

    steps:
      - name: Call Vercel IntegrityAudit API
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${VERCEL_APP_URL}" ]; then
            echo "::error::VERCEL_APP_URL secret is not set"
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi

          BASE_URL="${VERCEL_APP_URL%/}"
          TARGET_URL="${BASE_URL}/api/cron/integrityAudit"

          echo "📤 Triggering integrity audit (manual)..."

          HTTP_CODE=$(curl -s -L -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET_URL}")

          echo "HTTP Status: ${HTTP_CODE}"
          cat /tmp/response.txt

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::IntegrityAudit API returned ${HTTP_CODE}"
            exit 1
          fi

          echo "✅ Integrity audit completed"
