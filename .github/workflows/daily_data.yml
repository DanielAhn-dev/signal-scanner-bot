name: Daily Market Data Sync

permissions:
  contents: read

on:
  schedule:
    # 장 마감 후 데이터 수집: KST 18:10 = UTC 09:10 (월~금)
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_ohlcv:
        description: 'OHLCV 수집 스킵 (stock_daily 데이터가 이미 있을 때 지표·섹터·점수만 재계산)'
        type: boolean
        default: false
      trading_date:
        description: '기준 거래일 (YYYYMMDD, 비워두면 자동 감지)'
        type: string
        default: ''

jobs:
  fetch-and-process:
    runs-on: ubuntu-latest
    environment: production
    # 평소 23~30분 걸려 30분 제한에 걸려 취소됨(2026-09-28) → 여유를 둔다
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      KOREA_APP_KEY: ${{ secrets.KOREA_APP_KEY }}
      KOREA_APP_SECRET: ${{ secrets.KOREA_APP_SECRET }}
      # 배치 장애/점수엔진 폴백 알림(send_telegram_alert). 시크릿이 없으면 알림 없이 조용히 넘어간다.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TZ: "Asia/Seoul"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # universe_level(core/extended/tail) 자동 갱신 — 이게 꺼져 있으면 종목이 tail로
      # 강등된 뒤에도 영원히 재평가되지 않아 가격/지표 수집 대상에서 빠진 채로 방치된다.
      BATCH_AUTO_REFRESH_UNIVERSE: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 점수 단계는 TS 엔진(pnpm run sync:scores)이 우선이다. 예전엔 Node/pnpm 설치가 없어 엔진이
      # 매일 실패하고 Python 폴백 점수(매집·AVWAP·거래량비율 등 팩터 대부분 누락)만 저장됐다.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required environment variables
        run: |
          missing=()
          for key in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY KRX_ID KRX_PW KOREA_APP_KEY KOREA_APP_SECRET; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required env vars: ${missing[*]}"
            exit 1
          fi

      - name: Run Daily Batch (All-in-one)
        id: batch
        run: |
          echo "🚀 Starting daily batch: $(date)"
          ARGS=""
          if [ "${{ github.event.inputs.skip_ohlcv }}" = "true" ]; then
            ARGS="$ARGS --skip-ohlcv"
            echo "   ⏭️  OHLCV 수집 스킵 모드"
          fi
          if [ -n "${{ github.event.inputs.trading_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.trading_date }}"
            echo "   📅 기준일 지정: ${{ github.event.inputs.trading_date }}"
          fi
          python -u scripts/daily_batch.py $ARGS
          echo "🏁 Finished: $(date)"

      # 배치가 끝났어도 일부 종목만 적재됐거나 오늘 날짜 데이터가 비어 있으면 즉시 알린다
      # (정합성 크론·장 전 브리핑은 다음 날에야 알려준다). 이상이면 이 단계가 실패해 워크플로도 빨간불이 된다.
      # 휴장 평일에 이미 처리된 거래일이라 배치를 건너뛴 경우(holiday_guard)는 검증하지 않는다
      - name: Verify batch result
        if: always() && steps.batch.outputs.skipped != 'true'
        run: pnpm exec tsx scripts/ops/verify_batch_result.ts

      # 전략 경쟁 측정(전향 검증): 매일 그날의 실적 관문 판정·봇 계좌 평가액을 저장하고(--record) 웹 결과를 갱신한다.
      # 텔레그램 보고는 금요일 배치에서만 (scripts/strategy_forward_test.ts).
      - name: Strategy forward test
        if: always()
        continue-on-error: true
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "5" ] || [ "$(TZ=Asia/Seoul date +%u)" = "6" ]; then
            pnpm exec tsx scripts/strategy_forward_test.ts --telegram
          else
            pnpm exec tsx scripts/strategy_forward_test.ts --record
          fi

      # 종목 뉴스 헤드라인 일일 보관 — 매매에 쓰지 않고 2~3개월 뒤 효과 검증용 (src/services/newsArchive.ts)
      - name: Archive stock news headlines
        if: always()
        continue-on-error: true
        run: pnpm exec tsx scripts/collect_stock_news.ts

      # 리밸런싱 가이드 월 자동 기록 — 이번 달 기록이 없는 사용자만 (사실상 매월 첫 거래일 1회, scripts/income_guide_monthly.ts)
      - name: Income guide monthly snapshot
        if: always()
        continue-on-error: true
        run: pnpm exec tsx scripts/income_guide_monthly.ts

      # 금요일 배치(눌림목 신호 갱신) 직후 다음 주 주문표 발송 — 눌림목 PDF + 지정가·익절·손절 텍스트
      - name: Weekend order sheet (Fridays)
        if: always()
        continue-on-error: true
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "5" ] || [ "$(TZ=Asia/Seoul date +%u)" = "6" ]; then
            pnpm exec tsx scripts/send_weekend_order_sheet.ts --telegram
          else
            echo "금요일 배치에서만 실행"
          fi
