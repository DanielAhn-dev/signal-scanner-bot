name: Market Themes Snapshot

# 네이버 테마(약 260개) 장 마감 스냅샷 → market_themes·theme_daily (웹 '오늘 시장' 테마 흐름)
# 장중에는 저장하지 않으므로 마감 뒤에 돈다. GitHub 지연(4~5시간)에 대비해 두 번 돌리고, 같은 거래일은 덮어쓴다.
# 다음 날 09:00 뒤까지 밀리면 시장 상태가 OPEN이라 그날은 건너뛴다(하루 빠짐, 5일 등락은 쌓인 만큼만 반영).
on:
  schedule:
    # 평일 07:10 UTC(16:10 KST) · 11:40 UTC(20:40 KST)
    - cron: "10 7 * * 1-5"
    - cron: "40 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "저장하지 않고 결과만 출력"
        required: false
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect market themes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/collect_market_themes.ts --dryRun=${{ github.event.inputs.dry_run || 'false' }}
