name: Virtual AutoTrade Morning (KST 09:30)

on:
  schedule:
    # KST 09:30 = UTC 00:30 (월~금) 예정이지만 GitHub 스케줄 지연으로 실제로는 KST 14시대에 실행된다(2026-09 기록).
    # 주 경로는 Vercel 크론(vercel.json: 09시대·13시대·14시대)이고, 이 작업은 늦게라도 도는 백업이다.
    # 같은 실행창이면 run lock으로 중복 실행되지 않는다.
    - cron: "30 0 * * 1-5"
  workflow_dispatch:

jobs:
  run-virtual-autotrade-morning:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      TZ: "Asia/Seoul"

    steps:
      - name: Call Vercel VirtualAutoTrade API (morning)
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${VERCEL_APP_URL}" ]; then
            echo "::error::VERCEL_APP_URL secret is not set"
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi

          BASE_URL="${VERCEL_APP_URL%/}"
          # windowMinutes=60: 09:00 버킷 — 오후(13:30, T12:00버킷)와 중복 없음
          TARGET_URL="${BASE_URL}/api/cron/virtualAutoTrade?mode=auto&intradayOnly=true&windowMinutes=60&maxUsers=60"

          echo "📤 Triggering morning intraday virtual autotrade (KST ~09:30)..."
          echo "Target: ${TARGET_URL}"

          HTTP_CODE=$(curl -s -L -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET_URL}")

          echo "HTTP Status: ${HTTP_CODE}"
          cat /tmp/response.txt

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::VirtualAutoTrade API returned ${HTTP_CODE}"
            exit 1
          fi

          echo "✅ Morning intraday virtual autotrade completed"
